<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Vesma graphical abstract</title>
  <desc id="desc">Compiled reaction templates and an encoded molecule batch flow through optional fingerprint filtering, matching, bond edits, and precursor construction, producing raw precursor applications with provenance and optional molecular keys.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .b{fill:#f8fafc;stroke:#475569;stroke-width:2;rx:10}.g{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:10}.t{font:600 16px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:400 13px Arial,sans-serif;fill:#334155;text-anchor:middle}.a{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="920" height="300" fill="white"/>
  <rect class="b" x="22" y="52" width="138" height="78"/><text class="t" x="91" y="82">Compiled rules</text><text class="s" x="91" y="105">predicates + edits</text>
  <rect class="b" x="22" y="170" width="138" height="78"/><text class="t" x="91" y="200">Molecule batch</text><text class="s" x="91" y="223">initial or prior frontier</text>
  <rect class="g" x="205" y="96" width="138" height="108"/><text class="t" x="274" y="127">Fingerprint</text><text class="t" x="274" y="148">prefilter</text><text class="s" x="274" y="176">optional</text>
  <rect class="g" x="388" y="96" width="138" height="108"/><text class="t" x="457" y="127">Bit-parallel</text><text class="t" x="457" y="148">matching</text><text class="s" x="457" y="176">CPU · CUDA · Metal</text>
  <rect class="g" x="571" y="96" width="138" height="108"/><text class="t" x="640" y="127">Bond edits</text><text class="s" x="640" y="154">split + chemical</text><text class="s" x="640" y="176">perception</text>
  <rect class="b" x="754" y="96" width="144" height="108"/><text class="t" x="826" y="127">Raw precursors</text><text class="s" x="826" y="154">HitArray provenance</text><text class="s" x="826" y="176">optional WL keys</text>
  <path class="a" d="M160 91 C180 91 180 125 205 129"/><path class="a" d="M160 209 C180 209 180 175 205 171"/><path class="a" d="M343 150 L388 150"/><path class="a" d="M526 150 L571 150"/><path class="a" d="M709 150 L754 150"/>
  <text class="s" x="460" y="270">End-to-end reaction-template application for reusable retrosynthetic expansion</text>
</svg>
