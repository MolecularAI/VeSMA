project:
  type: default
  execute-dir: project
  output-dir: _output
  render:
    - index.qmd
    - si.qmd

format:
  typst:
    toc: false
    template-partials:
      - typst-template.typ
  docx: default

execute:
  freeze: false
  echo: false       # hide code globally
  keep-md: true

number-sections: true

bibliography: references.bib

csl: springer-basic-brackets.csl

project-url: https://github.com/alexvoronov/VeSMA/

jupyter: python3
