project:
  type: default
  execute-dir: project
  output-dir: _output
  render:
    - index.qmd
    - si.qmd

format:
  typst:
    toc: false
    template-partials:
      - typst-template.typ
  docx:
    reference-section-title: References
    filters:
      - docx-frontmatter.lua
      - path: docx-table-align.lua
        at: post-finalize

execute:
  freeze: false
  echo: false       # hide code globally
  keep-md: true

number-sections: true

bibliography: references.bib
csl: springer-basic-brackets.csl
link-citations: true

project-url: https://github.com/alexvoronov/VeSMA/

jupyter: python3
