name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - name: Install Python and dependencies
        # rdkit is pulled in by the dev extra; --frozen fails if uv.lock is out of sync.
        run: uv sync --frozen --python 3.14 --extra dev
      - name: Lint
        run: uv run --python 3.14 ruff check .
      - name: Format (ruff, canonical)
        run: uv run --python 3.14 ruff format --check .
      - name: Format (black, cross-check that both formatters agree)
        run: uv run --python 3.14 black --check .
      - name: Type check
        run: uv run --python 3.14 ty check
      - name: Test, including the documented example
        run: uv run --python 3.14 pytest
